<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{--deep-blue:#3368A0;--mid-blue:#66A3BF;--sage:#C8DFDB;--cream:#FFFFFF;--indigo:#293681;--royal:#4274D9;--sky:#95CCDD;--mint:#D0E7E6;--ink:#1C2430;--ink-soft:#4A5568;--ink-faint:#8792A2;--border:rgba(28,36,48,.10);--border-crisp:rgba(28,36,48,.13);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;width:390px;height:844px;background:#0B0E14;border-radius:52px;padding:14px;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;position:relative;overflow:hidden}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0B0E14;border-radius:0 0 18px 18px;z-index:5}
.home-indicator{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:999px;background:rgba(28,36,48,.35);z-index:6}
.screen{width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 4px;font-size:13px;font-weight:600;color:var(--ink)}
.content{flex:1;padding:16px 20px 0;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hi{font-size:13px;color:var(--ink-faint)}
.name{font-size:22px;font-weight:700;color:var(--ink)}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.stat{border:1px solid var(--border-crisp);border-radius:18px;padding:12px;text-align:center}
.stat .v{font-size:18px;font-weight:700;color:var(--ink)}
.stat .l{font-size:10.5px;color:var(--ink-faint);margin-top:2px}
.h2{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:10px}
.lcard{display:flex;align-items:center;gap:12px;border:1px solid var(--border-crisp);border-radius:18px;padding:14px;margin-bottom:10px}
.lic{width:48px;height:48px;border-radius:14px;background:var(--sky);color:var(--indigo);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lic svg{width:22px;height:22px}
.ltitle{font-size:13px;font-weight:700;color:var(--ink)}
.lsub{font-size:11px;color:var(--ink-faint);margin-top:2px}
.lprice{font-size:15px;font-weight:700;color:var(--ink)}
.fab{position:absolute;right:20px;bottom:92px;width:56px;height:56px;border-radius:999px;background:var(--deep-blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(28,36,48,.06),0 6px 16px rgba(28,36,48,.10);z-index:10}
.bottomnav{flex-shrink:0;display:flex;justify-content:space-around;align-items:center;padding:8px 8px 14px;border-top:1px solid var(--border);background:#fff}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-faint);font-size:10.5px;font-weight:600}
.navitem svg{width:20px;height:20px}
.navitem.active{color:var(--deep-blue)}
</style>
</helmet>
<div class="notch"></div>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span>••• 100%</span></div>
  <div class="content">
    <div class="row">
      <div><div class="hi">Colombo Spares Hub</div><div class="name">Your listings</div></div>
      <span class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></span>
    </div>
    <div class="g3">
      <div class="stat"><div class="v">18</div><div class="l">active</div></div>
      <div class="stat"><div class="v">3</div><div class="l">low stock</div></div>
      <div class="stat"><div class="v">2</div><div class="l">pending</div></div>
    </div>
    <div class="h2">Listings</div>
    <div class="lcard">
      <span class="lic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg></span>
      <span style="flex:1"><div class="ltitle">Compressor start relay</div><div class="lsub">Appliances · 34 in stock</div></span>
      <span class="lprice">Rs. 1,200</span>
    </div>
    <div class="lcard">
      <span class="lic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg></span>
      <span style="flex:1"><div class="ltitle">LG fridge door gasket</div><div class="lsub">Appliances · 12 in stock</div></span>
      <span class="lprice">Rs. 3,400</span>
    </div>
    <div class="lcard">
      <span class="lic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg></span>
      <span style="flex:1"><div class="ltitle">Universal TV mainboard</div><div class="lsub">Electronics · 5 in stock</div></span>
      <span class="lprice">Rs. 4,200</span>
    </div>
  </div>
  <div class="bottomnav">
    <div class="navitem active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/></svg><span>Listings</span></div>
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>Orders</span></div>
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg><span>Insights</span></div>
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-5 6-6 8-6s6.5 1 8 6"/></svg><span>Profile</span></div>
  </div>
  <div class="fab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
</div>
<div class="home-indicator"></div>
</x-dc>
</body>
</html>
