<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{--deep-blue:#3368A0;--mid-blue:#66A3BF;--sage:#C8DFDB;--cream:#FFFFFF;--indigo:#293681;--royal:#4274D9;--sky:#95CCDD;--mint:#D0E7E6;--ink:#1C2430;--ink-soft:#4A5568;--ink-faint:#8792A2;--border:rgba(28,36,48,.10);--border-crisp:rgba(28,36,48,.13);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;width:390px;height:844px;background:#0B0E14;border-radius:52px;padding:14px;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;position:relative;overflow:hidden}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0B0E14;border-radius:0 0 18px 18px;z-index:5}
.home-indicator{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:999px;background:rgba(28,36,48,.35);z-index:5}
.screen{width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 4px;font-size:13px;font-weight:600;color:var(--ink)}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 20px 8px}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.ttitle{flex:1;font-size:18px;font-weight:700;color:var(--ink)}
.content{flex:1;padding:2px 20px}
.card{border:1px solid var(--border-crisp);border-radius:18px;padding:16px;margin-bottom:16px}
.crow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.k{font-size:13px;color:var(--ink-faint)}
.v{font-size:15px;font-weight:700;color:var(--ink)}
.v.big{font-size:18px}
.h2{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:10px}
.paycard{border:1.5px solid var(--deep-blue);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.visa{width:38px;height:26px;border-radius:6px;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0}
.pname{font-size:13px;font-weight:700;color:var(--ink)}
.pexp{font-size:11px;color:var(--ink-faint);margin-top:2px}
.addcard{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--deep-blue);margin-bottom:20px}
.addcard svg{width:16px;height:16px}
.notice{background:var(--mint);border-radius:18px;padding:14px;display:flex;gap:10px;align-items:flex-start}
.notice svg{width:18px;height:18px;color:var(--deep-blue);flex-shrink:0}
.notice span{font-size:13px;color:var(--ink);line-height:18px}
.footer{padding:14px 20px;border-top:1px solid var(--border)}
.cta{height:48px;border-radius:12px;background:var(--deep-blue);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="notch"></div>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span>••• 100%</span></div>
  <div class="topbar"><span class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg></span><span class="ttitle">Checkout</span></div>
  <div class="content">
    <div class="card">
      <div class="crow"><span class="k">Plan</span><span class="v">Pro</span></div>
      <div class="crow" style="margin-bottom:0"><span class="k">Billed monthly</span><span class="v big">Rs. 2,500</span></div>
    </div>
    <div class="h2">Payment method</div>
    <div class="paycard">
      <span class="visa">VISA</span>
      <span style="flex:1"><div class="pname">Visa •••• 4242</div><div class="pexp">Expires 09/28</div></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--deep-blue)"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.5 2.5L16 9"/></svg>
    </div>
    <div class="addcard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add payment method</div>
    <div class="notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.1"/></svg><span>You can cancel or switch plans any time from Subscription settings.</span></div>
  </div>
  <div class="footer"><div class="cta">Pay Rs. 2,500</div></div>
</div>
<div class="home-indicator"></div>
</x-dc>
</body>
</html>
