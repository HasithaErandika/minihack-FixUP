<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{--deep-blue:#3368A0;--mid-blue:#66A3BF;--sage:#C8DFDB;--cream:#FFFFFF;--indigo:#293681;--royal:#4274D9;--sky:#95CCDD;--mint:#D0E7E6;--ink:#1C2430;--ink-soft:#4A5568;--ink-faint:#8792A2;--border:rgba(28,36,48,.10);--border-crisp:rgba(28,36,48,.13);--border-strong:rgba(28,36,48,.18);--success:#4C8B6B;--success-bg:#E4F1E8;}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;width:390px;height:844px;background:#0B0E14;border-radius:52px;padding:14px;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;position:relative;overflow:hidden}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0B0E14;border-radius:0 0 18px 18px;z-index:5}
.home-indicator{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:999px;background:rgba(28,36,48,.35);z-index:5}
.screen{width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 4px;font-size:13px;font-weight:600;color:var(--ink)}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 20px 8px}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.ttitle{flex:1;font-size:18px;font-weight:700;color:var(--ink)}
.content{flex:1;padding:8px 20px}
.progress{height:6px;border-radius:999px;background:var(--border);margin-bottom:24px;overflow:hidden}
.progress .fill{width:75%;height:100%;background:var(--deep-blue);border-radius:999px}
.h2{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:16px}
.summary{border:1px solid var(--border-crisp);border-radius:18px;padding:16px;margin-bottom:16px}
.srow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.srow .k{color:var(--ink-faint)}
.srow .v{font-weight:700;color:var(--ink)}
.divider{border-top:1px solid var(--border);margin:8px 0}
.desc{font-size:13px;color:var(--ink-faint);line-height:18px}
.impactcard{background:var(--mint);border-radius:18px;padding:14px;display:flex;gap:10px;align-items:flex-start}
.impactcard svg{width:18px;height:18px;color:var(--deep-blue);flex-shrink:0;margin-top:1px}
.impactcard span{font-size:13px;color:var(--ink);line-height:18px}
.footer{padding:14px 20px}
.cta{height:48px;border-radius:12px;background:var(--deep-blue);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="notch"></div>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span>••• 100%</span></div>
  <div class="topbar"><span class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg></span><span class="ttitle">Review &amp; submit</span></div>
  <div class="content">
    <div class="progress"><div class="fill"></div></div>
    <div class="h2">Review your request</div>
    <div class="summary">
      <div class="srow"><span class="k">Category</span><span class="v">Refrigerator</span></div>
      <div class="srow"><span class="k">Location</span><span class="v">Nugegoda, Colombo</span></div>
      <div class="divider"></div>
      <div class="desc">Fridge stopped cooling properly two days ago, makes a humming noise. LG double-door, ~6 years old.</div>
    </div>
    <div class="impactcard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21c9-1 14-6 14-16 -10 0-14 6-14 16Z"/><path d="M5 21c2-6 5-9 9-12"/></svg>
      <span>Choosing repair here could avoid up to <b>450kg CO₂</b> vs. buying new.</span>
    </div>
  </div>
  <div class="footer"><div class="cta">Submit request</div></div>
</div>
<div class="home-indicator"></div>
</x-dc>
</body>
</html>
