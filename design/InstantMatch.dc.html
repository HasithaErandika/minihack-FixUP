<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<style>
:root{--deep-blue:#3368A0;--mid-blue:#66A3BF;--sage:#C8DFDB;--cream:#FFFFFF;--indigo:#293681;--royal:#4274D9;--sky:#95CCDD;--mint:#D0E7E6;--ink:#1C2430;--ink-soft:#4A5568;--ink-faint:#8792A2;--border:rgba(28,36,48,.10);--border-crisp:rgba(28,36,48,.13);--border-strong:rgba(28,36,48,.18);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;width:390px;height:844px;background:#0B0E14;border-radius:52px;padding:14px;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;position:relative;overflow:hidden}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0B0E14;border-radius:0 0 18px 18px;z-index:5}
.home-indicator{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:999px;background:rgba(28,36,48,.35);z-index:5}
.screen{width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 4px;font-size:13px;font-weight:600;color:var(--ink)}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 20px 8px}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.ttitle{flex:1;font-size:18px;font-weight:700;color:var(--ink)}
.content{flex:1;padding:4px 20px}
.desc{font-size:13px;color:var(--ink-faint);margin-bottom:20px;line-height:18px}
.mcard{border:1px solid var(--border-crisp);border-radius:18px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.mcard.best{border-color:var(--deep-blue);border-width:1.5px}
.avatar{width:44px;height:44px;border-radius:999px;background:var(--sky);color:var(--indigo);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--mid-blue);flex-shrink:0}
.mname{font-size:15px;font-weight:700;color:var(--ink)}
.tag{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;background:var(--sky);color:var(--indigo);margin-left:6px}
.mmeta{font-size:11px;color:var(--ink-faint);margin-top:3px;display:flex;align-items:center;gap:4px}
.stars{color:#B8823A;display:flex;gap:1px}
.stars svg{width:11px;height:11px}
</style>
</helmet>
<div class="notch"></div>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span>••• 100%</span></div>
  <div class="topbar"><span class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg></span><span class="ttitle">Matched for you</span></div>
  <div class="content">
    <div class="desc">Ranked by rating, distance, and price.</div>

    <div class="mcard">

      <div><div class="mname">Nimal Wickrama</div><div class="mmeta"><span class="stars"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.6 5.9 6.4.6-4.8 4.4 1.4 6.3L12 17l-5.6 3.2 1.4-6.3-4.8-4.4 6.4-.6Z"/></svg><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.6 5.9 6.4.6-4.8 4.4 1.4 6.3L12 17l-5.6 3.2 1.4-6.3-4.8-4.4 6.4-.6Z"/></svg><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.6 5.9 6.4.6-4.8 4.4 1.4 6.3L12 17l-5.6 3.2 1.4-6.3-4.8-4.4 6.4-.6Z"/></svg><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.6 5.9 6.4.6-4.8 4.4 1.4 6.3L12 17l-5.6 3.2 1.4-6.3-4.8-4.4 6.4-.6Z"/></svg><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.6 5.9 6.4.6-4.8 4.4 1.4 6.3L12 17l-5.6 3.2 1.4-6.3-4.8-4.4 6.4-.6Z"/></svg></span> 4.9 · 2.1km · from Rs. 2,000</div></div>
    </div>
    <div class="mcard">
      <div class="avatar">KB</div>
      <div><div class="mname">Kasun Bandara</div><div class="mmeta"><span class="stars"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.6 5.9 6.4.6-4.8 4.4 1.4 6.3L12 17l-5.6 3.2 1.4-6.3-4.8-4.4 6.4-.6Z"/></svg><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.6 5.9 6.4.6-4.8 4.4 1.4 6.3L12 17l-5.6 3.2 1.4-6.3-4.8-4.4 6.4-.6Z"/></svg><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.6 5.9 6.4.6-4.8 4.4 1.4 6.3L12 17l-5.6 3.2 1.4-6.3-4.8-4.4 6.4-.6Z"/></svg><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.6 5.9 6.4.6-4.8 4.4 1.4 6.3L12 17l-5.6 3.2 1.4-6.3-4.8-4.4 6.4-.6Z"/></svg><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.6 5.9 6.4.6-4.8 4.4 1.4 6.3L12 17l-5.6 3.2 1.4-6.3-4.8-4.4 6.4-.6Z"/></svg></span> 4.6 · 3.0km · from Rs. 1,200</div></div>
    </div>
  </div>
</div>
<div class="home-indicator"></div>
</x-dc>
</body>
</html>
