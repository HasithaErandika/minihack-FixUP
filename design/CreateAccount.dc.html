<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{--deep-blue:#3368A0;--mid-blue:#66A3BF;--sage:#C8DFDB;--cream:#FFFFFF;--indigo:#293681;--royal:#4274D9;--sky:#95CCDD;--mint:#D0E7E6;--ink:#1C2430;--ink-soft:#4A5568;--ink-faint:#8792A2;--border:rgba(28,36,48,.10);--border-crisp:rgba(28,36,48,.13);--border-strong:rgba(28,36,48,.18);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;width:390px;height:844px;background:#0B0E14;border-radius:52px;padding:14px;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;position:relative;overflow:hidden}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0B0E14;border-radius:0 0 18px 18px;z-index:5}
.home-indicator{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:999px;background:rgba(28,36,48,.35);z-index:5}
.screen{width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 4px;font-size:13px;font-weight:600;color:var(--ink)}
.topbar{display:flex;align-items:center;padding:8px 16px 4px}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.content{flex:1;padding:0 24px}
.logo{width:26px;height:auto;display:block;margin:8px 0 20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--sky);color:var(--indigo);margin-bottom:16px}
.h1{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin-bottom:4px}
.sub{font-size:15px;line-height:22px;color:var(--ink-faint);margin-bottom:24px}
.field{margin-bottom:16px}
.label{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.inputicon{display:flex;align-items:center;gap:10px;border:1.5px solid var(--deep-blue);border-radius:12px;padding:13px 14px;background:#fff}
.field:not(.focused) .inputicon{border-color:var(--border-strong)}
.inputicon svg{width:18px;height:18px;color:var(--ink-faint);flex-shrink:0}
.inputicon .val{flex:1;font-size:15px;color:var(--ink)}
.footer{padding:16px 24px;border-top:1px solid var(--border)}
.cta{height:48px;border-radius:12px;background:var(--deep-blue);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center}
.legal{font-size:11px;color:var(--ink-faint);text-align:center;margin-top:10px}
</style>
</helmet>
<div class="notch"></div>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span>••• 100%</span></div>
  <div class="topbar"><span class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg></span></div>
  <div class="content">
    <img class="logo" src="logo-mark.png" alt="FixUP">
    <div class="chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.3 2.3-2-2Z"/></svg>Signing up as Technician</div>
    <div class="h1">Create your account</div>
    <div class="sub">Prefilled with a sample profile.</div>
    <div class="field">
      <div class="label">Full name</div>
      <div class="inputicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-5 6-6 8-6s6.5 1 8 6"/></svg><span class="val">Dinesh Fernando</span></div>
    </div>
    <div class="field">
      <div class="label">Email</div>
      <div class="inputicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg><span class="val">dinesh@example.com</span></div>
    </div>
    <div class="field focused">
      <div class="label">Password</div>
      <div class="inputicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="11" width="15" height="9" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg><span class="val">•••••••••</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ink-faint)"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg></div>
    </div>
  </div>
  <div class="footer">
    <div class="cta">Continue</div>
    <div class="legal">You'll verify your identity next.</div>
  </div>
</div>
<div class="home-indicator"></div>
</x-dc>
</body>
</html>
