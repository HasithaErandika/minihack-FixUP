<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{--deep-blue:#3368A0;--mid-blue:#66A3BF;--sage:#C8DFDB;--cream:#FFFFFF;--indigo:#293681;--royal:#4274D9;--sky:#95CCDD;--mint:#D0E7E6;--ink:#1C2430;--ink-soft:#4A5568;--ink-faint:#8792A2;--border:rgba(28,36,48,.10);--border-crisp:rgba(28,36,48,.13);--border-strong:rgba(28,36,48,.18);--gradient-brand:linear-gradient(135deg,#3368A0 0%,#4274D9 100%);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;width:390px;height:844px;background:#0B0E14;border-radius:52px;padding:14px;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;position:relative;overflow:hidden}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0B0E14;border-radius:0 0 18px 18px;z-index:5}
.home-indicator{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:999px;background:rgba(28,36,48,.35);z-index:6}
.screen{width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 4px;font-size:13px;font-weight:600;color:var(--ink);flex-shrink:0}
.content{flex:1;padding:16px 20px 0;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hi{font-size:13px;color:var(--ink-faint);font-weight:500}
.name{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.icons{display:flex;gap:8px}
.iconbtn{position:relative;width:40px;height:40px;border-radius:999px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.dot{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 3px;border-radius:999px;background:#B24B4B;color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--cream)}
.impact{background:var(--gradient-brand);border-radius:18px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:16px;color:#fff}
.impact .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.impact .ic svg{width:24px;height:24px}
.impact .lbl{font-size:13px;opacity:.85;margin-bottom:6px}
.pbar{height:6px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.pbar .fill{height:100%;width:62%;background:#fff;border-radius:999px}
.chev-w{opacity:.85}
.cta{height:48px;border-radius:12px;background:var(--deep-blue);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px}
.h2{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:10px}
.jobcard{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border-crisp);border-radius:18px;margin-bottom:20px}
.jobic{width:40px;height:40px;border-radius:12px;background:var(--mint);color:var(--deep-blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.jtitle{font-size:13px;font-weight:700;color:var(--ink)}
.jsub{font-size:11px;color:var(--ink-faint);margin-top:2px}
.badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#FBF0DF;color:#B8823A}
.rail{display:flex;gap:12px;margin-bottom:20px}
.techcard{width:150px;flex-shrink:0;padding:14px;border:1px solid var(--border-crisp);border-radius:18px}
.avatar{width:44px;height:44px;border-radius:999px;background:var(--sky);color:var(--indigo);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--mid-blue)}
.tname{font-size:13px;font-weight:700;color:var(--ink);margin-top:8px}
.tsub{font-size:11px;color:var(--ink-faint);margin-top:2px}
.bottomnav{flex-shrink:0;display:flex;justify-content:space-around;align-items:center;padding:8px 8px 14px;border-top:1px solid var(--border);background:#fff}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-faint);font-size:10.5px;font-weight:600}
.navitem svg{width:21px;height:21px}
.navitem.active{color:var(--deep-blue)}
.fab{position:absolute;right:20px;bottom:92px;width:56px;height:56px;border-radius:999px;background:var(--deep-blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(28,36,48,.06),0 6px 16px rgba(28,36,48,.10);z-index:10}
</style>
</helmet>
<div class="notch"></div>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span>••• 100%</span></div>
  <div class="content">
    <div class="row">
      <div><div class="hi">Good to see you,</div><div class="name">Ishara</div></div>
      <div class="icons">
        <span class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4Z"/></svg></span>
        <span class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dot">2</span></span>
      </div>
    </div>
    <div class="impact">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21c9-1 14-6 14-16 -10 0-14 6-14 16Z"/><path d="M5 21c2-6 5-9 9-12"/></svg></div>
      <div style="flex:1">
        <div class="lbl">Repair Regular · 1,240 pts</div>
        <div class="pbar"><div class="fill"></div></div>
      </div>
      <span class="chev-w"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
    </div>
    <div class="cta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Post a repair request</div>
    <div class="h2">Active repairs</div>
    <div class="jobcard">
      <span class="jobic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.3 2.3-2-2Z"/></svg></span>
      <span style="flex:1"><div class="jtitle">Refrigerator not cooling</div><div class="jsub">Dinesh Fernando</div></span>
      <span class="badge">in progress</span>
    </div>
    <div class="h2">Recommended for you</div>
    <div class="rail">
      <div class="techcard"><div class="avatar">DF</div><div class="tname">Dinesh Fernando</div><div class="tsub">Electronics · 1.4km</div></div>
      <div class="techcard"><div class="avatar">NW</div><div class="tname">Nimal Wickrama</div><div class="tsub">Appliances · 2.1km</div></div>
    </div>
  </div>
  <div class="bottomnav">
    <div class="navitem active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg><span>Home</span></div>
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11l4.5-2.5Z"/></svg><span>Discover</span></div>
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21c9-1 14-6 14-16 -10 0-14 6-14 16Z"/><path d="M5 21c2-6 5-9 9-12"/></svg><span>Impact</span></div>
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-5 6-6 8-6s6.5 1 8 6"/></svg><span>Profile</span></div>
  </div>
  <div class="fab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
</div>
<div class="home-indicator"></div>
</x-dc>
</body>
</html>
