<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{--deep-blue:#3368A0;--mid-blue:#66A3BF;--sage:#C8DFDB;--cream:#FFFFFF;--indigo:#293681;--royal:#4274D9;--sky:#95CCDD;--mint:#D0E7E6;--ink:#1C2430;--ink-soft:#4A5568;--ink-faint:#8792A2;--border:rgba(28,36,48,.10);--border-crisp:rgba(28,36,48,.13);--success:#4C8B6B;}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;width:390px;height:844px;background:#0B0E14;border-radius:52px;padding:14px;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;position:relative;overflow:hidden}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0B0E14;border-radius:0 0 18px 18px;z-index:20}
.home-indicator{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:999px;background:rgba(28,36,48,.35);z-index:20}
.screen{width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;position:relative}
.base{padding:70px 24px 0;text-align:center}
.check{width:88px;height:88px;border-radius:50%;background:#E4F1E8;color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.check svg{width:44px;height:44px}
.h1{font-size:22px;font-weight:700;color:var(--ink)}
.sub{font-size:13px;color:var(--ink-faint);margin-top:4px}
.card{border:1px solid var(--border-crisp);border-radius:18px;padding:16px;margin-top:24px;text-align:left}
.crow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.crow .lbl{font-size:13px;color:var(--ink-faint)}
.chip{font-size:15px;font-weight:800;color:var(--success);background:#E4F1E8;padding:4px 10px;border-radius:999px}
.pts{font-size:28px;font-weight:700;color:var(--ink)}
.pbar{height:8px;border-radius:999px;background:var(--border);overflow:hidden;margin-top:14px}
.pbar .fill{height:100%;width:100%;background:var(--deep-blue);border-radius:999px}
.overlay{position:absolute;inset:0;background:rgba(15,20,28,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;z-index:10}
.badge{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#3368A0,#4274D9);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(41,54,129,.5)}
.badge svg{width:56px;height:56px}
.lname{color:#fff;font-weight:800;font-size:22px;margin-top:8px}
.lsub{color:rgba(255,255,255,.75);font-size:13px}
.tap{color:rgba(255,255,255,.55);font-size:11px;margin-top:20px}
.confetti{position:absolute;width:7px;height:11px;border-radius:2px}
</style>
</helmet>
<div class="notch"></div>
<div class="screen">
  <div class="base">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.5 2.5L16 9"/></svg></div>
    <div class="h1">Repair completed!</div>
    <div class="sub">Nice work choosing repair over replacement.</div>
    <div class="card">
      <div class="crow"><span class="lbl">Impact points earned</span><span class="chip">+180 pts</span></div>
      <div class="pts">3,600</div>
      <div class="pbar"><div class="fill"></div></div>
    </div>
  </div>
  <div class="overlay">
    <span class="confetti" style="background:#66A3BF;left:35%;top:30%;transform:rotate(20deg)"></span>
    <span class="confetti" style="background:#95CCDD;left:62%;top:26%;transform:rotate(-30deg)"></span>
    <span class="confetti" style="background:#D0E7E6;left:28%;top:52%;transform:rotate(60deg)"></span>
    <span class="confetti" style="background:#4274D9;left:70%;top:55%;transform:rotate(-10deg)"></span>
    <span class="confetti" style="background:#C8DFDB;left:48%;top:22%;transform:rotate(5deg)"></span>
    <span class="confetti" style="background:#66A3BF;left:20%;top:38%;transform:rotate(-50deg)"></span>
    <span class="confetti" style="background:#4274D9;left:78%;top:40%;transform:rotate(35deg)"></span>
    <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0Z"/><path d="M8 5H5a3 3 0 0 0 3 4"/><path d="M16 5h3a3 3 0 0 1-3 4"/><path d="M12 13v3M9 21h6M9 21c0-2 1-2.5 3-2.5s3 .5 3 2.5"/></svg></div>
    <div class="lname">Circular Champion</div>
    <div class="lsub">New level unlocked</div>
    <div class="tap">Tap anywhere to continue</div>
  </div>
</div>
<div class="home-indicator"></div>
</x-dc>
</body>
</html>
