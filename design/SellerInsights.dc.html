<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{--deep-blue:#3368A0;--mid-blue:#66A3BF;--sage:#C8DFDB;--cream:#FFFFFF;--indigo:#293681;--royal:#4274D9;--sky:#95CCDD;--mint:#D0E7E6;--ink:#1C2430;--ink-soft:#4A5568;--ink-faint:#8792A2;--border:rgba(28,36,48,.10);--border-crisp:rgba(28,36,48,.13);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;width:390px;height:844px;background:#0B0E14;border-radius:52px;padding:14px;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;position:relative;overflow:hidden}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0B0E14;border-radius:0 0 18px 18px;z-index:5}
.home-indicator{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:999px;background:rgba(28,36,48,.35);z-index:6}
.screen{width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 4px;font-size:13px;font-weight:600;color:var(--ink)}
.content{flex:1;padding:16px 20px 0;overflow:hidden}
.h1{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{border:1px solid var(--border-crisp);border-radius:18px;padding:14px}
.stat .l{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:6px}
.stat .v{font-size:18px;font-weight:700;color:var(--ink)}
.card{border:1px solid var(--border-crisp);border-radius:18px;padding:16px;margin-bottom:16px}
.chart{display:flex;align-items:flex-end;gap:8px;height:90px}
.bar{flex:1;background:var(--mid-blue);border-radius:6px 6px 0 0}
.h2{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:10px}
.prow{display:flex;justify-content:space-between;border:1px solid var(--border-crisp);border-radius:18px;padding:14px;margin-bottom:10px}
.prow span:first-child{font-size:13px;font-weight:600;color:var(--ink)}
.prow span:last-child{font-size:13px;font-weight:700;color:var(--ink)}
.plancard{background:var(--mint);border-radius:18px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.plancard .l{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink)}
.plancard .l svg{width:16px;height:16px;color:var(--deep-blue)}
.plancard .r{display:flex;align-items:center;gap:4px;color:var(--deep-blue);font-weight:700;font-size:13px}
.plancard .r svg{width:16px;height:16px}
.bottomnav{flex-shrink:0;display:flex;justify-content:space-around;align-items:center;padding:8px 8px 14px;border-top:1px solid var(--border);background:#fff}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-faint);font-size:10.5px;font-weight:600}
.navitem svg{width:20px;height:20px}
.navitem.active{color:var(--deep-blue)}
</style>
</helmet>
<div class="notch"></div>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span>••• 100%</span></div>
  <div class="content">
    <div class="h1">Marketplace Insights</div>
    <div class="g2">
      <div class="stat"><div class="l">This month</div><div class="v">Rs. 84,500</div></div>
      <div class="stat"><div class="l">Orders fulfilled</div><div class="v">214</div></div>
    </div>
    <div class="card">
      <div style="font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px">Revenue — last 7 days</div>
      <div class="chart"><div class="bar" style="height:35%"></div><div class="bar" style="height:60%"></div><div class="bar" style="height:45%"></div><div class="bar" style="height:90%"></div><div class="bar" style="height:76%"></div><div class="bar" style="height:83%"></div><div class="bar" style="height:100%"></div></div>
    </div>
    <div class="h2">Top-selling parts</div>
    <div class="prow"><span>Compressor start relay</span><span>Rs. 1,200</span></div>
    <div class="prow"><span>LG fridge door gasket</span><span>Rs. 3,400</span></div>
    <div class="plancard"><span class="l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 5 3 7.5 7 9 4-1.5 7-4 7-9V6Z"/><path d="m9 12 2 2 4-4"/></svg>Seller plan: Growth</span><span class="r">Manage<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span></div>
  </div>
  <div class="bottomnav">
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/></svg><span>Listings</span></div>
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>Orders</span></div>
    <div class="navitem active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg><span>Insights</span></div>
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-5 6-6 8-6s6.5 1 8 6"/></svg><span>Profile</span></div>
  </div>
</div>
<div class="home-indicator"></div>
</x-dc>
</body>
</html>
