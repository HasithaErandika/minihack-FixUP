<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixUP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

  <div class="stage">
    <div class="stage__brand">
      <img src="assets/logo-full.png" alt="FixUP" style="height:26px;width:auto;">
    </div>

    <div class="phone">
      <div class="phone__notch"></div>
      <div class="phone__screen">
        <div id="statusbar" class="statusbar"></div>

        <div class="app-shell">
          <div class="screen-viewport" id="viewport"></div>
          <button class="fab" id="fab" hidden></button>
          <nav class="bottom-nav" id="bottomNav"></nav>
        </div>

        <div class="toast" id="toastHost"></div>

        <div class="overlay" id="filterSheet">
          <div class="sheet">
            <div class="sheet__handle"></div>
            <div class="sheet__title">Filters</div>
            <div class="text-small text-muted" style="margin-bottom:12px">Category</div>
            <div class="u-flex u-gap-2" style="flex-wrap:wrap;margin-bottom:16px">
              <button class="chip chip--selectable chip--selected">All</button>
              <button class="chip chip--selectable">Electronics</button>
              <button class="chip chip--selectable">Appliances</button>
              <button class="chip chip--selectable">Vehicles</button>
              <button class="chip chip--selectable">Garments</button>
            </div>
            <div class="text-small text-muted" style="margin-bottom:12px">Minimum rating</div>
            <div class="u-flex u-gap-2" style="margin-bottom:20px">
              <button class="chip chip--selectable">3.5+</button>
              <button class="chip chip--selectable chip--selected">4.0+</button>
              <button class="chip chip--selectable">4.5+</button>
            </div>
            <button class="btn btn-primary btn-block" data-apply-filter>Apply filters</button>
          </div>
        </div>

        <div class="phone__home-indicator"></div>
      </div>
    </div>

  </div>

<script src="js/icons.js"></script>
<script src="js/data/impactFactors.js"></script>
<script src="js/data/seed.js"></script>
<script src="js/core.js"></script>
<script src="js/actions.js"></script>
<script src="js/screens/shared.js"></script>
<script src="js/screens/consumer.js"></script>
<script src="js/screens/technician.js"></script>
<script src="js/screens/seller.js"></script>
<script src="js/app.js"></script>
</body>
</html>
